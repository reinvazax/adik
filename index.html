<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Princess 💗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="landing.css">
</head>

<body>

    <div class="floaties" id="floaties"></div>

    <main class="landing">
        <div class="doll-wrap">
            <div class="doll-shadow"></div>
            <svg class="doll" id="doll" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
                <!-- ears -->
                <circle cx="90" cy="78" r="40" fill="#C99A72" />
                <circle cx="230" cy="78" r="40" fill="#C99A72" />
                <circle cx="90" cy="78" r="20" fill="#8B5A3C" />
                <circle cx="230" cy="78" r="20" fill="#8B5A3C" />

                <!-- arms -->
                <ellipse class="arm arm-left" cx="72" cy="205" rx="30" ry="42" fill="#C99A72" />
                <ellipse class="arm arm-right" cx="248" cy="205" rx="30" ry="42" fill="#C99A72" />

                <!-- body -->
                <ellipse cx="160" cy="230" rx="92" ry="70" fill="#DDB48C" />

                <!-- head -->
                <circle cx="160" cy="150" r="92" fill="#C99A72" />
                <ellipse cx="160" cy="168" rx="58" ry="46" fill="#F1D3AE" />

                <!-- blush -->
                <ellipse cx="112" cy="168" rx="16" ry="10" fill="#FF9EBB" opacity="0.75" />
                <ellipse cx="208" cy="168" rx="16" ry="10" fill="#FF9EBB" opacity="0.75" />

                <!-- eyes (happy closed arcs) -->
                <path d="M126 144c6 10 20 10 26 0" stroke="#4A3B3E" stroke-width="5" stroke-linecap="round"
                    fill="none" />
                <path d="M168 144c6 10 20 10 26 0" stroke="#4A3B3E" stroke-width="5" stroke-linecap="round"
                    fill="none" />

                <!-- nose + mouth -->
                <ellipse cx="160" cy="170" rx="9" ry="6" fill="#4A3B3E" />
                <path d="M160 176v6c0 6 8 10 14 6M160 182c-6 4-14 0-14-6" stroke="#4A3B3E" stroke-width="3.5"
                    stroke-linecap="round" fill="none" />

                <!-- bow -->
                <path d="M160 100l-22-14c-6-4-14 2-11 9l9 15-9 15c-3 7 5 13 11 9l22-14z" fill="#FF6F91" />
                <path d="M160 100l22-14c6-4 14 2 11 9l-9 15 9 15c3 7-5 13-11 9l-22-14z" fill="#FF6F91" />
                <circle cx="160" cy="100" r="9" fill="#FF5C8A" />

                <!-- heart in paws -->
                <g class="doll-heart" transform="translate(160,244)">
                    <path d="M0 18C-22 2 -22 -22 -4 -22c8 0 12 6 4 6s-4-6 4-6c18 0 18 24 -4 40z" fill="#FF5C8A"
                        transform="scale(1.15)" />
                </g>
            </svg>

            <div class="sparkle s1">✦</div>
            <div class="sparkle s2">✧</div>
            <div class="sparkle s3">✦</div>
        </div>

        <h1>Halo, Princess Manis <span>🥺💗</span></h1>
        <p class="sub">ada kejutan kecil buat kamu di sini...<br>mau lihat nggak? 👉</p>

        <a href="rain.html" class="open-btn" id="openBtn">
            <span>Buka Kejutannya</span>
            <span class="paw">🐾</span>
        </a>
    </main>

    <script src="landing.js"></script>
</body>

</html>
